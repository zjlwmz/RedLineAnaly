<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1993 年 CLCD 土地覆盖分析</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;font:14px/1.5 "Microsoft YaHei",sans-serif;color:#263238}
  #app{display:flex;height:100%}#panel{width:390px;min-width:390px;overflow:auto;padding:18px;background:#fff;border-right:1px solid #ddd}
  #map{flex:1}h1{font-size:19px;margin:0 0 4px}.sub{font-size:12px;color:#667085;margin-bottom:16px}
  .card{border:1px solid #e3e7ec;border-radius:8px;padding:13px;margin:0 0 12px;background:#fafbfc}
  label{display:block;font-size:12px;color:#667085;margin:9px 0 4px}select,button,input[type=file]{font:inherit}select,input[type=file]{width:100%;padding:7px;border:1px solid #cfd6df;border-radius:6px;background:white}
  .row{display:flex;gap:8px;margin-top:12px}button,.download{border:1px solid #cfd6df;background:#fff;border-radius:6px;padding:7px 11px;cursor:pointer;text-decoration:none;color:#1d4ed8}
  button.primary{background:#1d4ed8;color:white;border-color:#1d4ed8}button:disabled{opacity:.55;cursor:not-allowed}
  .hint{color:#667085;font-size:12px;margin-top:9px}.status{padding:9px 11px;border-radius:6px;background:#eef4ff;margin:10px 0}.error{background:#fef3f2;color:#b42318}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:white;border:1px solid #e3e7ec;padding:9px;border-radius:6px}
  .metric small{display:block;color:#667085}.metric strong{font-size:17px}table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:6px;border-bottom:1px solid #e8eaed;text-align:left}th:nth-child(n+2),td:nth-child(n+2){text-align:right}
  .download{display:inline-block;margin:5px 5px 0 0}.hidden{display:none}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>土地覆盖面积分析</h1>
    <div class="sub">1993 年 CLCD · 30 米分类栅格 · 面内面积统计与成果导出</div>
    <div class="card">
      <b>选择分析范围</b>
      <div class="hint">可选择省、市、县，导入 GeoJSON，或用地图左侧工具绘制范围；最后一次选择的范围生效。</div>
      <label for="province">省</label><select id="province"><option value="">请选择</option></select>
      <label for="city">市</label><select id="city" disabled><option value="">可只选择省</option></select>
      <label for="county">县</label><select id="county" disabled><option value="">可只选择市</option></select>
      <label for="geojson">GeoJSON 文件（WGS84 经纬度，可含多个面）</label><input id="geojson" type="file" accept=".geojson,.json,application/geo+json,application/json">
      <div class="row"><button id="clear">清空范围</button><button id="analyze" class="primary" disabled>计算并导出</button></div>
      <div class="hint" id="selection">尚未选择范围</div>
    </div>
    <div id="status" class="status hidden"></div>
    <div id="result" class="hidden"></div>
  </aside>
  <div id="map"></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
const $ = id => document.getElementById(id);
const map = L.map('map').setView([35,105],4);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18,attribution:'© OpenStreetMap contributors'}).addTo(map);
const drawn = new L.FeatureGroup().addTo(map);
map.addControl(new L.Control.Draw({draw:{polygon:{allowIntersection:false},rectangle:true,marker:false,polyline:false,circle:false,circlemarker:false},edit:{featureGroup:drawn}}));
let selection = null;
let activeTask = null;

function showStatus(message, error=false){$('status').textContent=message;$('status').classList.remove('hidden');$('status').classList.toggle('error',error)}
function clearStatus(){$('status').classList.add('hidden')}
function setSelection(value,label,geometry){
  selection=value;activeTask=null;drawn.clearLayers();
  if(geometry){const layer=L.geoJSON(geometry,{style:{color:'#1d4ed8',weight:2,fillOpacity:.12}});layer.eachLayer(part=>drawn.addLayer(part));map.fitBounds(drawn.getBounds(),{padding:[20,20]})}
  $('selection').textContent=label;$('analyze').disabled=false;$('result').classList.add('hidden');clearStatus();
}
map.on(L.Draw.Event.CREATED,e=>{setSelection({geometry:e.layer.toGeoJSON().geometry,geometry_srid:4326},'手绘面',e.layer.toGeoJSON().geometry)});
map.on(L.Draw.Event.EDITED,()=>{const layer=drawn.getLayers()[0];if(layer)setSelection({geometry:layer.toGeoJSON().geometry,geometry_srid:4326},'手绘面',layer.toGeoJSON().geometry)});
map.on(L.Draw.Event.DELETED,()=>{selection=null;activeTask=null;$('selection').textContent='尚未选择范围';$('analyze').disabled=true;$('result').classList.add('hidden')});

function geojsonPolygon(data){
  if(!data||typeof data!=='object')throw new Error('GeoJSON 内容无效');
  const crs=data.crs?.properties?.name;
  if(data.crs&&!/^(EPSG:4326|urn:ogc:def:crs:EPSG::4326|OGC:CRS84|urn:ogc:def:crs:OGC:1\.3:CRS84)$/i.test(crs||''))
    throw new Error('GeoJSON 必须使用 WGS84 经纬度（EPSG:4326）');
  const items=data.type==='FeatureCollection'?data.features:[data];
  if(!Array.isArray(items)||!items.length)throw new Error('GeoJSON 中没有面要素');
  const polygons=[];
  for(const item of items){
    const geometry=item?.type==='Feature'?item.geometry:item;
    if(geometry?.type==='Polygon'&&Array.isArray(geometry.coordinates)&&geometry.coordinates.length)
      polygons.push(geometry.coordinates);
    else if(geometry?.type==='MultiPolygon'&&Array.isArray(geometry.coordinates)&&geometry.coordinates.length)
      polygons.push(...geometry.coordinates);
    else throw new Error('GeoJSON 仅支持 Polygon、MultiPolygon 或由面组成的 FeatureCollection');
  }
  // 后端接收一个面几何；多个要素组成 MultiPolygon，保留每个面的原始边界。
  return polygons.length===1?{type:'Polygon',coordinates:polygons[0]}:{type:'MultiPolygon',coordinates:polygons};
}
$('geojson').onchange=async e=>{
  const file=e.target.files[0];if(!file)return;
  try{
    const geometry=geojsonPolygon(JSON.parse((await file.text()).replace(/^\uFEFF/,'')));
    const bounds=L.geoJSON(geometry).getBounds();
    if(!bounds.isValid()||bounds.getWest()<-180||bounds.getEast()>180||bounds.getSouth()<-90||bounds.getNorth()>90)
      throw new Error('GeoJSON 坐标或面范围无效，请确认使用 WGS84 经纬度');
    setSelection({geometry,geometry_srid:4326},`GeoJSON：${file.name}`,geometry);
    $('province').value='';resetSelect($('city'),'可只选择省');resetSelect($('county'),'可只选择市');
  }catch(error){showStatus(`导入失败：${error.message}`,true)}
  finally{e.target.value=''}
};

async function api(url,options){const resp=await fetch(url,options);const body=await resp.json();if(!resp.ok||!body.success)throw new Error(body.msg||`HTTP ${resp.status}`);return body.data}
function resetSelect(el,hint){el.replaceChildren(new Option(hint,''));el.disabled=true}
async function fillRegions(level,parent,el){
  const url=`/landcover/regions?level=${level}`+(parent?`&parent_code=${encodeURIComponent(parent)}`:'');
  const rows=await api(url);resetSelect(el,'请选择');
  for(const row of rows)el.add(new Option(`${row.name} (${row.code})`,row.code));
  el.disabled=false;
}
async function chooseRegion(level,code){
  if(!code)return;
  try{
    showStatus('正在读取行政区边界…');
    const region=await api(`/landcover/region-geometry?level=${level}&code=${encodeURIComponent(code)}`);
    setSelection({region_level:level,region_code:code},`${region.name} · ${code}`,region.geometry);
  }catch(e){showStatus(e.message,true)}
}
$('province').onchange=async()=>{
  resetSelect($('city'),'可只选择省');resetSelect($('county'),'可只选择市');
  const code=$('province').value;if(!code){$('clear').click();return}
  await chooseRegion('province',code);
  try{await fillRegions('city',code,$('city'))}catch(e){showStatus(e.message,true)}
};
$('city').onchange=async()=>{
  resetSelect($('county'),'可只选择市');const code=$('city').value;
  if(!code){await chooseRegion('province',$('province').value);return}
  await chooseRegion('city',code);
  try{await fillRegions('county',code,$('county'))}catch(e){showStatus(e.message,true)}
};
$('county').onchange=()=>chooseRegion($('county').value?'county':'city',$('county').value||$('city').value);
$('clear').onclick=()=>{
  selection=null;activeTask=null;drawn.clearLayers();$('province').value='';resetSelect($('city'),'可只选择省');resetSelect($('county'),'可只选择市');$('geojson').value='';
  $('selection').textContent='尚未选择范围';$('analyze').disabled=true;$('result').classList.add('hidden');clearStatus();
};

const area=v=>`${(v/1e6).toLocaleString('zh-CN',{maximumFractionDigits:4})} km²`;
const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(result,state){
  const rows=result.classes.map(c=>`<tr><td>${c.code} · ${escapeHtml(c.name)}</td><td>${area(c.area_m2)}</td><td>${c.percent.toFixed(2)}%</td></tr>`).join('');
  const splitName={province:'省',city:'市',county:'县'}[result.split_level]||'单机';
  $('result').innerHTML=`<div class="card"><b>统计结果</b><div class="hint">${result.year} 年 · 按${splitName}拆分 · 像元中心口径 · ${result.pixel_size_m} 米像元</div>
    <div class="metrics" style="margin-top:10px">
      <div class="metric"><small>输入面面积</small><strong>${area(result.input_area_m2)}</strong></div>
      <div class="metric"><small>有效分类面积</small><strong>${area(result.valid_area_m2)}</strong></div>
      <div class="metric"><small>面内像元面积</small><strong>${area(result.pixel_mask_area_m2)}</strong></div>
      <div class="metric"><small>有效覆盖率</small><strong>${result.coverage_percent.toFixed(2)}%</strong></div>
    </div><div class="hint">NoData 面积：${area(result.nodata_area_m2)}。类别占比的分母是有效分类面积。</div>
    <table><thead><tr><th>类型</th><th>面积</th><th>占有效面积</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="hint">矢量分类斑块：${result.vector_feature_count.toLocaleString('zh-CN')} 个</div>
    <a class="download" href="${result.raster_url}">下载裁剪 GeoTIFF</a>
    <a class="download" href="${result.vector_url}">下载分类 GeoPackage</a>
    <div class="hint">创建：${escapeHtml(state.created_at?.replace('T',' ')||'--')} · 完成：${state.finished_at_estimated?'约 ':''}${escapeHtml(state.finished_at?.replace('T',' ')||'--')} · 耗时：${state.duration_seconds==null?'--':state.duration_seconds.toLocaleString('zh-CN')+' 秒'}</div>
    <div class="hint">任务 ID：${result.task_id}</div></div>`;
  $('result').classList.remove('hidden');
}
$('analyze').onclick=async()=>{
  if(!selection)return;
  $('analyze').disabled=true;$('result').classList.add('hidden');showStatus('正在拆分任务…');
  try{
    const task=await api('/landcover/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(selection)});
    activeTask=task.task_id;
    while(activeTask===task.task_id){
      const state=await api(`/landcover/result/${task.task_id}`);
      if(activeTask!==task.task_id)break;
      if(state.status==='done'){
        render(state.result,state);clearStatus();break;
      }
      if(state.status==='failed')throw new Error(state.error||'子任务失败');
      const splitName={province:'省',city:'市',county:'县'}[state.split_level]||state.split_level;
      if(state.status==='planning'){
        showStatus(`任务 ${task.task_id} · 正在按${splitName}拆分任务…`);
        await new Promise(resolve=>setTimeout(resolve,2000));
        continue;
      }
      const detail=state.subtasks.filter(s=>s.status==='success').map(s=>s.name).slice(-3).join('、');
      showStatus(`按${splitName}拆分 · 任务 ${task.task_id} · ${state.finished}/${state.total} 个子任务已完成`+(state.status==='aggregating'?'，正在合并栅格与矢量分块…':detail?` · 最近完成：${detail}`:''));
      await new Promise(resolve=>setTimeout(resolve,2000));
    }
  }catch(e){showStatus(`分析失败：${e.message}`,true)}
  finally{if(selection)$('analyze').disabled=false}
};
fillRegions('province',null,$('province')).catch(e=>showStatus(`行政区列表读取失败：${e.message}`,true));
</script>
</body>
</html>
