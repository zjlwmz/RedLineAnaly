# ============================================================
# CLCD 土地覆盖分析 - 配置文件
# 修改后直接运行: python main.py
# ============================================================

[default]

# ---------- 1993 年 CLCD 土地覆盖分析 ----------
clcd_raster = D:\data_work\suanzi\tif\CLCD_v01_1993_albert.tif
admin_data_dir = D:\data_work\suanzi\base
# 栅格、矢量成果及分块文件按任务 ID 分目录存放
output_dir = D:\data_work\suanzi\out
# 0 表示不按包围框像元数限制范围；计算按 512×512 像元块读取
max_export_pixels = 0
# 子任务按省、市、县行政区划拆分；环境变量 LANDCOVER_SPLIT_LEVEL 可覆盖
split_level = county
# 多节点部署时，上方 output_dir 必须是所有节点可读写的同一路径共享目录
landcover_task_queue = landcover_task_queue
landcover_result_queue = landcover_result_queue
landcover_dlx = landcover_task_dlx
landcover_dlq = landcover_task_dlq

# 节点角色：
#   all    = CLCD Web + Worker；RabbitMQ 不可用时本机后台计算
#   master = 仅 CLCD Web、任务投递、成果合并与下载
#   slave  = 仅 CLCD Worker；扩容时多开几个 Slave 进程
role = all

# ---------- 旧版红线叠加 demo 参数，当前 main.py 不使用 ----------
# 红线 GPKG 所在目录（按省一个文件，文件名=行政区划代码，如 110000.gpkg）
redline_data_dir = data
# 严重压盖阈值（并集压盖面积 / 输入面面积），按项目标准调整
severe_ratio = 0.5
# 红线缓冲距离（米），规避红线在省界被裁剪导致的漏判
buffer_m = 50

# ---------- RabbitMQ 连接 ----------
rabbitmq_host = 192.168.1.230
rabbitmq_port = 5672
rabbitmq_user = admin
rabbitmq_password = 123456
rabbitmq_vhost = /
rabbitmq_heartbeat = 60

# ---------- Master 的 REST 服务 ----------
master_host = 0.0.0.0
master_port = 8001

# 是否开启 CORS（跨域资源共享）：
#   true  = 开启跨域访问（前端页面/其他域名的服务可以调用本接口），并可通过 cors_origins 限定来源
#   false = 不开启（浏览器跨域调用会被拦截，只允许同源调用）
cors_enabled = true
# 允许的来源域名，多个用英文逗号分隔；* 表示允许任意来源（cors_enabled=true 时生效）
cors_origins = *

# ---------- RabbitMQ 主题（Topic 路由键 / 队列绑定键） ----------
# 以下主题键仅供旧红线 demo 使用；CLCD 使用上方独立队列名称。
# Master 投递"按省计算任务"时使用的路由键（必须能被任务队列的绑定键匹配）
task_routing_key = task.redline.calculate
# 任务队列与任务交换机之间的绑定键（# 匹配任意后续词）
task_binding_key = task.redline.#
# Slave 回传"计算结果"时使用的路由键（必须能被结果队列的绑定键匹配）
result_routing_key = result.redline.overlay
# 结果队列与结果交换机之间的绑定键
result_binding_key = result.redline.#
# 注意：主/从节点必须使用同一份配置，改主题时两边都要改并重启

# ---------- 数据持久化 ----------
# SQLite 数据库文件：任务与子任务状态落库，服务停止/断电重启后可从库中恢复待处理任务并继续执行
# 相对路径时相对工程目录
db_path = tasks.db

# ---------- Slave 消费控制 ----------
# 未ACK前最多预取几条任务（长任务建议保持1，多个Slave间公平分发）
prefetch_count = 1
# 单任务最大重试次数，超过后进入死信队列
task_max_retries = 2
# 断线重连间隔（秒）
reconnect_interval = 5
